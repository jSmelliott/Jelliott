<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jack Elliott – Engineering Portfolio</title>
<meta name="description" content="Engineering projects by Jack Elliott.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #eef2f4;
    --grid: #d3dde2;
    --ink: #14202b;
    --muted: #4d5d6b;
    --accent: #1f5fbf;
    --rule: #14202b;
    --sans: "Archivo", system-ui, sans-serif;
    --serif: "Source Serif 4", Georgia, serif;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    color: var(--ink);
    font: 1.0625rem/1.6 var(--serif);
    background-color: var(--paper);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 32px 32px;
  }
  a { color: var(--accent); }
  a:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  .wrap { max-width: 920px; margin: 0 auto; padding: 0 1.25rem; }

  header { padding: 4rem 0 2.5rem; }
  .intro { display: flex; gap: 2rem; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; }
  .intro-text { flex: 1 1 24rem; }
  .portrait { margin: 0; flex: 0 0 auto; border: 2px solid var(--rule); background: var(--grid); }
  .portrait img { display: block; width: 220px; max-width: 100%; aspect-ratio: 4 / 5; object-fit: cover; }
  .portrait figcaption { padding: .35rem .75rem; font: .8rem var(--sans); color: var(--muted); background: var(--paper); border-top: 2px solid var(--rule); }
  .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 2px; border: 2px solid var(--rule); background: var(--rule); margin-bottom: 1rem; }
  .gallery:empty { display: none; }
  .gallery figure { margin: 0; background: var(--grid); }
  .gallery img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; }
  .gallery figcaption { padding: .35rem .75rem; font: .8rem var(--sans); color: var(--muted); background: var(--paper); }
  h1 {
    font: 800 clamp(2.4rem, 7vw, 4.5rem)/1 var(--sans);
    letter-spacing: -0.03em;
    margin: 0 0 1rem;
  }
  .lede { max-width: 38rem; font-size: 1.25rem; margin: 0 0 1.25rem; }
  nav { font: 600 0.95rem var(--sans); display: flex; flex-wrap: wrap; gap: 1.25rem; }

  h2 { font: 600 1.1rem var(--sans); margin: 3rem 0 1rem; }

  /* Each project is laid out like a drawing title block */
  .sheet {
    background: var(--paper);
    border: 2px solid var(--rule);
    margin: 0 0 2rem;
  }
  .sheet-body { padding: 1.25rem 1.5rem; }
  .sheet h3 { font: 800 1.6rem/1.15 var(--sans); letter-spacing: -0.01em; margin: 0 0 .5rem; }
  .sheet p { margin: 0 0 .75rem; max-width: 62ch; }
  .sheet ul { margin: 0 0 .75rem; padding-left: 1.25rem; max-width: 62ch; }
  .links { font: 600 .95rem var(--sans); display: flex; gap: 1.25rem; margin-top: .5rem; }
  .block {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    border-top: 2px solid var(--rule);
    font: .85rem/1.4 var(--sans);
  }
  .block div { padding: .6rem 1rem; border-left: 1px solid var(--rule); }
  .block div:first-child { border-left: 0; }
  .block dt { color: var(--muted); font-weight: 400; }
  .block dd { margin: 0; font-weight: 600; }
  .block dl { display: contents; }
  @media (max-width: 640px) {
    .block { grid-template-columns: 1fr 1fr; }
    .block div:nth-child(3) { border-left: 0; }
    .block div:nth-child(n+3) { border-top: 1px solid var(--rule); }
  }

  .photos { display: grid; grid-template-columns: repeat(2, 1fr); gap: .75rem; padding: 1rem 1.5rem; border-bottom: 2px solid var(--rule); }
  .photos:empty { display: none; }
  .photos figure { margin: 0; min-width: 0; border: 2px solid var(--rule); background: var(--grid); }
  .photos img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; }
  .photos figcaption { padding: .35rem .6rem; font: .8rem/1.3 var(--sans); color: var(--muted); background: var(--paper); border-top: 2px solid var(--rule); }

  .about { background: var(--paper); border: 2px solid var(--rule); padding: 1.25rem 1.5rem; }
  .about p { margin: 0 0 .75rem; max-width: 62ch; }
  footer { padding: 3rem 0 4rem; font: .9rem var(--sans); color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="intro">
      <div class="intro-text">
        <h1>Jack Elliott</h1>
        <p class="lede">Electrical Engineering Student.</p>
          

        <nav>
          <a href="#projects">Projects</a>
          <a href="#about">About</a>
          <a href="mailto:Jack@wkndfilmco.com">Email</a>
          <a href="https://github.com/jSmelliott">GitHub</a>
          <a href="https://www.linkedin.com/in/jtelliott1">LinkedIn</a>
          <a href="Jack Elliott Resume (1).pdf">Resume (PDF)</a>
        </nav>
      </div>
      <figure class="portrait">
        <img src="images/portrait.jpg" alt="Portrait of Jack Elliott" onerror="this.closest('figure').remove()">
        <figcaption>Jack Elliott</figcaption>
      </figure>
    </div>
  </header>

  <main>
    <div class="gallery" id="gallery"></div>

    <h2 id="projects">Projects</h2>
    <div id="project-list"></div>


  </main>

  <footer>© <span id="year"></span> Jack Elliott</footer>
</div>

<script>
  // EDIT THIS LIST. Add, remove or reorder projects; the page updates itself.
  // summary = a paragraph. bullets = optional list shown under it. photos and links are optional.
  const projects = [
    {
      title: "Tire Temp IR Matrix",
      summary: " Developing a 192-point tire temperature sensor for data acquisition on a Formula Student car.",
        bullets: [
        "Using an STM32 to compress data for transfer over CAN bus",
      ],
      role: "49er Formula SAE",
      stack: "Altium, Fusion360, STM32CubeMX",
      year: "2026",
      status: "In Progress",
      photos: [        { src: "john2.png", alt: "Full Assm", caption: "I2c to CAN bus" },
       { src: "pepe.png", alt: "IRAssm", caption: "IR Sensor modual" }
],
      links: []
    },
     {
      title: "Wearable Electromyography Rep Tracker",
      summary: "Developed a wearable electromyography (EMG) rep tracker integrating analog signal conditioning, custom electronics, Bluetooth communication, and a wearable enclosure.",
      bullets: [
        "Researched unmet clinical and fitness needs addressable through wearable EMG sensing and scoped project requirements using a formal engineering design process",
        "Designed and simulated an analog comparator circuit and ADC signal chain in LTSpice to condition raw EMG signals for digital processing",
        "Developed, laid out, and assembled a custom low-profile PCB, iterating from prototype to final revision",
        "Developed an Android application to interface with an ESP32 over Bluetooth for real-time data transfer and communication",
        "Fabricated a custom arm sleeve to house and secure electronics for wearable use"
      ],
      role: "Team lead of 3",
      stack: "LTSpice, PCB design, ESP32, Bluetooth, Android development",
      year: "2025",
      status: "Completed",
      photos: [{ src: "repsync.png", alt: "Stress contour plot of the turbine blade", caption: "PCB with insert frame" }, 
      { src: "FRAME.png", alt: "Stress contour plot of the turbine blade", caption: "Front of PCB" },
      { src: "FRAME2.png", alt: "Stress contour plot of the turbine blade", caption: "Back of PCB" },
    { src: "sow.png", alt: "Stress contour plot of the turbine blade", caption: "sewing sleeve" },
     { src: "final.png", alt: "Stress contour plot of the turbine blade", caption: "Final Compression sleeve" }],
      links: []
    },
    
    {
      title: "Fabric-Hardware Interfaces",
      summary: "Designed and prototyped proprietary mechanical interfaces for fabric-integrated electronics. The product connects proprietary fabric PCBs and their components.",
      bullets: [
        "Used Design for Manufacturability philosophy to create an easily and cheaply manufactured end product",
        "Researched optimal material durometer",
        "Tested low-resistance trace materials"
      ],
      role: "Intern at Dotbliss, LLC",
      stack: "Fusion 360, SLA 3D printing, advanced manufacturing processes",
      year: "2024-2026",
      status: "Completed",
      photos: [
        { src: "Hapticframe.png", alt: "Haptic Driver frame render", caption: "Haptic Driver frame render" },
        { src: "image (5).png", alt: "Driver fabric interface", caption: "Haptic Driver frame with filled traces" },
        { src: "R2 DOUBLE HOLES.png", alt: "EL Driver fabric interface", caption: "EL Driver frame render" },
        { src: "image (6).png", alt: "Driver fabric interface", caption: "EL Driver frame with unfilled traces" },
        { src: "image (3).png", alt: "Driver fabric interface", caption: "Frame implemented in design (Cropped to preserve sensitive information)" },
        { src: "stampsocket.png", alt: "Driver fabric interface", caption: "M5 Stamp frame" }
      ],
      links: []
    }
  ];

  // EDIT THIS LIST. Photos shown in a strip under the intro. Fix the alt text and captions to describe each image.
  const gallery = [
    //{ src: "R2 DOUBLE HOLES.png", alt: "R2 double holes part", caption: "R2 double holes" },
   // { src: "Hapticframe2.png", alt: "Haptic frame, second view", caption: "Haptic frame" },
//{ src: "Hapticframe.png", alt: "Haptic frame", caption: "Haptic frame" }
  ];

  const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const src = s => esc(encodeURI(s)); // handles spaces in filenames

  const figure = (ph, fallbackAlt) => `
    <figure>
      <img src="${src(ph.src)}" alt="${esc(ph.alt || fallbackAlt)}" loading="lazy" onerror="this.closest('figure').remove()">
      ${ph.caption ? `<figcaption>${esc(ph.caption)}</figcaption>` : ""}
    </figure>`;

  document.getElementById("project-list").innerHTML = projects.map(p => `
    <article class="sheet">
      <h3 style="padding: 30px;">${esc(p.title)}</h3>
      ${(p.photos && p.photos.length) ? `<div class="photos">${p.photos.map(ph => figure(ph, p.title)).join("")}</div>` : ""}
      <div class="sheet-body">
        
        <p>${esc(p.summary)}</p>
        ${(p.bullets && p.bullets.length) ? `<ul>${p.bullets.map(b => `<li>${esc(b)}</li>`).join("")}</ul>` : ""}
        ${(p.links && p.links.length) ? `<div class="links">${p.links.map(l => `<a href="${esc(l.url)}">${esc(l.label)}</a>`).join("")}</div>` : ""}
      </div>
      <div class="block">
        <dl>
          <div><dt>Role</dt><dd>${esc(p.role)}</dd></div>
          <div><dt>Tools</dt><dd>${esc(p.stack)}</dd></div>
          <div><dt>Year</dt><dd>${esc(p.year)}</dd></div>
          <div><dt>Status</dt><dd>${esc(p.status)}</dd></div>
        </dl>
      </div>
    </article>`).join("");

  document.getElementById("gallery").innerHTML = gallery.map(ph => figure(ph, "")).join("");

  document.getElementById("year").textContent = new Date().getFullYear();
</script>
</body>
</html>
